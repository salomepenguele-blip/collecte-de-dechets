<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bangui Propre - Collecte de Déchets</title>
</head>
<body>
  <h1>Bangui Propre</h1>
  <p>Signalez un déchet, on vient le collecter dans votre quartier.</p>

  <h2>Signaler un déchet</h2>
  <form>
    <label>Quartier :</label><br>
    <input type="text" placeholder="Ex: Lakouanga"><br><br>

    <label>Type de déchet :</label><br>
    <select>
      <option>Plastique</option>
      <option>Ordures ménagères</option>
      <option>Verre</option>
      <option>Autre</option>
    </select><br><br>

    <button type="submit">Envoyer le signalement</button>
  </form>
</body>
</html>
